<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="build" content="2026-11-22.3">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aquelarre">
<meta name="theme-color" content="#0b0710">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Aquelarre</title>
<style>
:root{--bg:#000;--bg2:#16181c;--bg3:#202327;--line:#2f3336;--tx:#e7e9ea;--tx2:#71767b;--azul:#ff3d8b;--rosa:#ff3d8b;--verde:#00ba7c;--st:0px;--sb:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050307;color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:transparent;border:0;outline:0;resize:none;-webkit-user-select:text;user-select:text}
.tx,.bb{-webkit-user-select:text;user-select:text}

/* ---------- el móvil ---------- */
body.pantalla #movil{position:fixed;inset:0;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
body.marco{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1a1020,#050307 70%)}
body.marco #movil{position:relative;width:393px;height:852px;border-radius:56px;box-shadow:0 0 0 11px #121014,0 0 0 13px #2a2630,0 30px 80px rgba(0,0,0,.7);--st:54px;--sb:24px;transform:scale(var(--escala,1))}
#movil{overflow:hidden;background:#0b0710;isolation:isolate}
.isla{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:90;display:none}
.estado{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0 46px;display:none;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:16px;z-index:89;pointer-events:none;color:#fff}
.estado .der{display:flex;gap:6px;align-items:center;margin-top:1px}
body.marco .isla,body.marco .estado{display:flex}
.estado.oscura{color:#fff}

/* fondo */
.fondo{position:absolute;inset:0;z-index:0;background:
 radial-gradient(60% 40% at 15% 20%,rgba(255,61,139,.55),transparent 70%),
 radial-gradient(55% 45% at 90% 35%,rgba(120,40,200,.55),transparent 70%),
 radial-gradient(70% 50% at 50% 100%,rgba(255,61,139,.35),transparent 70%),
 linear-gradient(170deg,#1c0d22,#0b0710 60%,#160a18)}
.fondo:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:3px 3px;opacity:.6}

/* ---------- inicio ---------- */
.home{position:absolute;inset:0;z-index:1;padding:calc(var(--st) + 14px) 22px calc(var(--sb) + 10px);display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s,opacity .35s}
.home.atras{transform:scale(.92);filter:blur(6px) brightness(.6)}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.wg{height:158px;border-radius:22px;padding:14px;background:rgba(30,16,36,.55);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;flex-direction:column}
.wg .et{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ff8ab8}
.wg .ev{margin-top:8px;font-size:13px;line-height:1.25}
.wg .ev b{display:block;font-size:15px}
.wg .ev span{color:rgba(255,255,255,.6);display:block}
.wg .post{border:0;padding:0;margin-top:8px;gap:8px}
.wg .post .av{width:26px;height:26px;font-size:12px}
.wg .post .tx{font-size:13px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;position:relative}
.ic .cara{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .15s}
.ic:active .cara{transform:scale(.9);filter:brightness(.8)}
.ic .cara svg{width:100%;height:100%;display:block}
.ic .cara{position:relative}.ic .cara img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}.ic .cara img.ok{opacity:1}
.ic .nom{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.ic .badge{position:absolute;top:-6px;right:0;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;z-index:2}
.puntos{display:flex;justify-content:center;gap:8px;margin:auto 0 14px}
.puntos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.puntos i.on{background:#fff}
.dock{display:flex;justify-content:space-around;padding:14px 10px;border-radius:34px;background:rgba(40,24,48,.45);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid rgba(255,255,255,.07)}
.dock .nom{display:none}

/* ---------- capa de app ---------- */
.app{position:absolute;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;overflow:hidden;border-radius:inherit}
.app.oculta{display:none}
.app .cont{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.indicador{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sb) + 4px);z-index:40;display:flex;justify-content:center;align-items:flex-end;padding-bottom:max(8px,calc(var(--sb) - 18px))}
.indicador i{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);pointer-events:auto;position:relative}
.indicador{pointer-events:none}
.indicador i::after{content:'';position:absolute;left:-8px;right:-8px;top:-8px;bottom:-6px}
body.pantalla .indicador{height:28px;padding-bottom:calc(var(--sb) + 6px);bottom:0}
.volver{position:absolute;left:12px;bottom:calc(var(--sb) + 10px);z-index:41;display:none}

.top{position:relative;z-index:20;background:rgba(0,0,0,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--st);flex:none}
.top .fila{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px}
.top h1{font-size:19px;font-weight:800;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;color:var(--tx2);font-weight:400}
.ico{width:20px;height:20px;fill:currentColor;flex:none}
.atras{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;margin-left:-8px}
.atras:active{background:var(--bg3)}
.casa{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;margin-right:-6px;color:var(--tx2)}
.nav{flex:none;background:rgba(0,0,0,.9);border-top:1px solid var(--line);padding-bottom:calc(var(--sb) + 2px);position:relative;z-index:20}
.nav .in{display:flex;height:50px}
.nav a{flex:1;display:grid;place-items:center;color:var(--tx2);position:relative}
.nav a.on{color:var(--tx)}
.nav .ico{width:25px;height:25px}
.punto{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--azul);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.sinnav{padding-bottom:calc(var(--sb) + 30px)}

/* ---------- Vox (la red tipo X) ---------- */
.post{display:flex;gap:10px;padding:12px 16px 4px;border-bottom:1px solid var(--line)}
.post:active{background:#080808}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;background:#333;font-size:16px}
.av img{width:100%;height:100%;object-fit:cover}
.cuerpo{flex:1;min-width:0}
.cab{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.cab .n{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.cab .u,.cab .t{color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.cab .t{flex:none}
.verif{width:18px;height:18px;fill:var(--azul);flex:none}
.verif.oro{fill:#e2b719}
.tx{white-space:pre-wrap;word-wrap:break-word;margin:2px 0 0}
.tx .m,.tx .h{color:var(--azul)}
.rt{color:var(--tx2);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;padding:8px 16px 0 42px}
.rt .ico{width:16px;height:16px}
.media{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.media img{display:block;width:100%;max-height:520px;object-fit:cover;cursor:zoom-in}
.masop{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:none;border:0;color:var(--tx2);font-size:20px;line-height:1}
.datos .enl{color:#ff8fbd;cursor:pointer}
.pestanas{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tabs a{flex:1;height:48px;display:grid;place-items:center;color:var(--tx2);font-weight:600;text-decoration:none}
.tabs a.on{color:var(--tx);font-weight:700;box-shadow:inset 0 -4px 0 var(--azul)}
.persona{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.persona .u{color:var(--tx2);font-size:15px}
.persona .bio1{margin-top:4px;font-size:15px}
.tesigue{background:var(--bg3);color:var(--tx2);font-size:12px;padding:1px 6px;border-radius:4px;margin-left:4px}
.perfil .datos a{color:var(--tx2);text-decoration:none}
.perfil .datos a b{color:var(--tx)}
.perfil .banner img,.perfil .avg img{cursor:zoom-in}
.bb img{display:block;max-width:100%;border-radius:14px;margin-bottom:4px}
.escribir .clip{width:38px;height:38px;display:grid;place-items:center;color:var(--azul);flex:none}
.escribir .mcaja{flex:1;display:flex;flex-direction:column;gap:6px}
.escribir .mcaja textarea{width:100%}
#mprev img{max-height:90px;border-radius:10px}
.visor{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.visor img{max-width:100%;max-height:100%;object-fit:contain}
.visor .vbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:14px 18px calc(var(--sb) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.7))}
.visor .vbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:20px;padding:9px 18px;font:inherit;font-weight:600}
.visor #vg{background:#ff3d8b}
.cita{margin-top:10px;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.cita .av{width:20px;height:20px;font-size:10px}
.acc{display:flex;justify-content:space-between;max-width:425px;margin:6px 0 4px -8px;color:var(--tx2);font-size:13px}
.acc button{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:20px}
.acc .ico{width:18px;height:18px}
.acc button.lk.on{color:var(--rosa)}
.acc button.rp.on{color:var(--verde)}
.enc{margin-top:10px}
.enc .op{position:relative;height:32px;margin:6px 0;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 10px;width:100%}
.enc .op .b{position:absolute;inset:0 auto 0 0;background:var(--bg3);border-radius:6px}
.enc .op.win .b{background:rgba(255,61,139,.4)}
.enc .op span{position:relative}
.enc .op.votar{border:1px solid var(--azul);color:var(--azul);justify-content:center;font-weight:700;border-radius:20px}
.enc .pie{color:var(--tx2);font-size:13px}
.det .tx{font-size:17px;margin-top:12px}
.det .meta{color:var(--tx2);padding:14px 0;border-bottom:1px solid var(--line)}
.det .cifras{display:flex;gap:18px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--tx2)}
.det .cifras b{color:var(--tx)}
.resp{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.resp textarea{flex:1;font-size:17px;min-height:40px;padding:8px 0}
.btn{background:var(--tx);color:#000;font-weight:700;border-radius:20px;padding:0 16px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.btn.azul{background:var(--azul);color:#fff}
.btn.borde{background:transparent;color:var(--tx);border:1px solid #536471}
.btn:disabled{opacity:.5}
.fab{position:absolute;right:16px;bottom:calc(var(--sb) + 66px);width:56px;height:56px;border-radius:50%;background:var(--azul);display:grid;place-items:center;box-shadow:0 0 14px rgba(255,61,139,.45);z-index:25}
.fab .ico{width:24px;height:24px;fill:#fff}
.enresp{color:var(--tx2);font-size:14px;margin:2px 0}
.enresp a{color:var(--azul)}
.perfil .banner{height:130px;background:linear-gradient(135deg,#1a1a2e,#3a1c3e)}
.perfil .banner img{width:100%;height:100%;object-fit:cover}
.perfil .fila1{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;margin-top:-40px}
.perfil .avg{width:84px;height:84px;font-size:32px;border:4px solid #000}
.perfil .info{padding:10px 16px 12px}
.perfil .nombre{font-size:20px;font-weight:800;display:flex;align-items:center;gap:4px}
.perfil .info .u{color:var(--tx2)}
.perfil .bio{margin:10px 0;white-space:pre-wrap}
.perfil .datos{color:var(--tx2);font-size:15px;display:flex;gap:16px;flex-wrap:wrap}
.perfil .datos b{color:var(--tx)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:48px;color:var(--tx2);font-weight:600;position:relative}
.tabs button.on{color:var(--tx);font-weight:700}
.tabs button.on:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:4px;border-radius:4px;background:var(--azul)}
.conv{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.conv .ult{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.nueva .ult{color:var(--tx);font-weight:600}
.burbujas{padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-height:100%}
.bb{max-width:78%;padding:9px 13px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word}
.bb.yo{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
.bb.el{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:4px}
.bb .hora{display:block;font-size:11px;opacity:.65;margin-top:3px}
.escribir{flex:none;background:#000;border-top:1px solid var(--line);padding:8px 12px calc(var(--sb) + 8px);display:flex;gap:8px;align-items:flex-end}
.escribir textarea{flex:1;background:var(--bg3);border-radius:20px;padding:9px 14px;max-height:120px}
.vacio{padding:48px 32px;text-align:center;color:var(--tx2)}
.vacio h2{color:var(--tx);font-size:24px;margin:0 0 8px}
.cargando{padding:40px;text-align:center;color:var(--tx2)}
.mas{display:block;width:100%;padding:16px;color:var(--azul)}
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);background:var(--azul);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:80;max-width:90%;white-space:nowrap}
.modal{position:absolute;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;padding-top:var(--st)}
.modal .fila{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;height:50px}
.modal .red{display:flex;gap:10px;padding:8px 16px}
.modal textarea{flex:1;font-size:19px;min-height:160px;padding-top:6px}
.modal .cnt{color:var(--tx2);font-size:13px;padding:0 16px}
.modal .cnt.mal{color:#f4212e}
.campo{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:14px}
.campo label{display:block;color:var(--tx2);font-size:13px}
.campo input{width:100%;font-size:17px;padding:4px 0}
.edit .campo{margin:0 16px 14px}

/* ---------- Medidor ---------- */
.tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.tj{background:var(--bg2);border-radius:16px;padding:14px}
.tj .k{color:var(--tx2);font-size:13px}
.tj .v{font-size:24px;font-weight:800;margin-top:4px}
.tj .s{color:var(--tx2);font-size:12px;margin-top:2px}
.barra{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:#7cd992}
.barra i.alto{background:#ff453a}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--tx2);font-weight:600}
td.num,th.num{text-align:right}
.seccion{padding:16px 16px 6px;font-weight:800;font-size:17px}
.aviso{color:var(--tx2);font-size:13px;margin-top:16px}

/* ---------- apps sencillas ---------- */
.lista{margin:16px;border-radius:12px;background:var(--bg2);overflow:hidden}
.lista .it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #26262a}
.lista .it:last-child{border-bottom:0}
.lista .it .k{flex:1}
.lista .it .v{color:var(--tx2)}
.titulo-grande{font-size:32px;font-weight:800;padding:calc(var(--st) + 10px) 16px 4px}
.dia{padding:10px 16px 4px;color:var(--tx2);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dia.hoy{color:#ff3d8b}
.evento{display:flex;gap:12px;margin:6px 16px;padding:12px;border-radius:12px;background:var(--bg2);border-left:4px solid var(--c,#ff3d8b)}
.evento .h{color:var(--tx2);min-width:46px}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:14px}
.splash .logo{width:96px;height:96px;border-radius:24px;overflow:hidden}
.splash h2{margin:0;font-size:26px}
.splash p{margin:0;color:rgba(255,255,255,.6);max-width:280px}
.hilo{background:#0c0a0f}
.hilo .conv .av{width:50px;height:50px;font-size:20px}
.aviso-hilo{margin:12px 16px;padding:10px 14px;border-radius:12px;background:rgba(255,214,10,.12);color:#ffd60a;font-size:13px;text-align:center}
.chatfondo{background:#0c0a0f radial-gradient(rgba(255,61,139,.06) 1px,transparent 1px) 0 0/18px 18px}


/* ---------- directo ---------- */
.vivo{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3040;margin-right:6px;box-shadow:0 0 0 0 rgba(255,48,64,.7);animation:latido 1.6s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(255,48,64,.6)}70%{box-shadow:0 0 0 8px rgba(255,48,64,0)}100%{box-shadow:0 0 0 0 rgba(255,48,64,0)}}
.directo{display:flex;align-items:center;gap:10px;margin:10px 16px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,48,64,.18),rgba(255,61,139,.08));border:1px solid rgba(255,48,64,.35)}
.directo b{display:block}.directo span{color:var(--tx2);font-size:13px}
.anillo{position:relative;border-radius:50%;padding:3px;background:conic-gradient(#ff3040,#ff3d8b,#ff3040)}
.anillo .avg{border-color:#000}
.chip-vivo{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#ff3040;color:#fff;font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px;border:2px solid #000;white-space:nowrap}
.cuad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cuad a{aspect-ratio:1;overflow:hidden;background:#111}
.cuad img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- Nocturna ---------- */
.noc{--n1:#ff3d8b;--n2:#1a0f1f;background:#0d0810}
.noc .ban{height:150px;background:radial-gradient(70% 90% at 20% 30%,rgba(255,61,139,.55),transparent),radial-gradient(60% 80% at 85% 60%,rgba(122,44,255,.5),transparent),#1a0f1f;position:relative}

/* ---------- agenda (provisional: sale del lore y de las bios) ---------- */
let AGENDA = [
  { dia: 1, quien: 'VeeNoir', usuario: 'veenoir', que: 'Directo · LoL', hora: '21:00', dur: 180, c: '#ff3d8b' },
  { dia: 3, quien: 'VeeNoir', usuario: 'veenoir', que: 'Directo · LoL', hora: '21:00', dur: 180, c: '#ff3d8b' },
  { dia: 5, quien: 'Yoruha', usuario: 'yoruha_', que: 'Directo de canto', hora: '22:00', dur: 90, c: '#a78bfa' },
  { dia: 6, quien: 'VeeNoir', usuario: 'veenoir', que: 'Directo · GTA 6', hora: '21:00', dur: 180, c: '#ff3d8b' },
];
/* directo: si ahora cae dentro de un evento de la agenda */
function enDirecto(usuario = null) {
  const ahora = new Date();
  for (const k of [0, -1]) {
    const d = new Date(ahora); d.setDate(d.getDate() + k);
    for (const e of AGENDA.filter(e => e.dia === d.getDay() && (!usuario || e.usuario === usuario))) {
      const [h, m] = e.hora.split(':'); const ini = new Date(d); ini.setHours(+h, +m, 0, 0);
      const fin = new Date(+ini + (e.dur || 120) * 60e3);
      if (ahora >= ini && ahora < fin) return { ...e, ini, fin };
    }
  }
  return null;
}
function espectadores(ev) {
  const base = ev.usuario === 'veenoir' ? 2400 : 650;
  const t = (Date.now() - ev.ini) / 60e3, dur = ev.dur || 120;
  const curva = Math.min(1, t / 20) * (1 - Math.max(0, (t - dur * .7) / (dur * .3)) * .5);
  const ruido = Math.sin(Date.now() / 47000) * .06 + Math.sin(Date.now() / 13000) * .03;
  return Math.max(12, Math.round(base * curva * (1 + ruido)));
}
/* las cifras simuladas crecen poco a poco desde que se publica */
function crece(total, creado, horas = 3) {
  total = Number(total) || 0; if (!total) return 0;
  const t = Math.max(0, (Date.now() - new Date(creado)) / 36e5);
  return Math.round(total * (1 - Math.exp(-t / horas)));
}
function proximos(n = 3) {
  const ahora = new Date(), out = [];
  for (let k = 0; k < 8 && out.length < n; k++) {
    const d = new Date(ahora); d.setDate(d.getDate() + k);
    for (const e of AGENDA.filter(e => e.dia === d.getDay())) {
      const [h, m] = e.hora.split(':'); const f = new Date(d); f.setHours(+h, +m, 0, 0);
      if (f > ahora - 2 * 3600e3) out.push({ ...e, f, k });
    }
  }
  return out.slice(0, n);
}
const cuando = e => e.k === 0 ? 'Hoy' : e.k === 1 ? 'Mañana' : DIAS[e.f.getDay()].replace(/^./, c => c.toUpperCase());

async function cargarCuentas() {
  const { data, error } = await sb.from('cuentas').select('*').order('creado');
  if (error) throw error;
  S.cuentas.clear(); S.porUser.clear();
  for (const c of data) { S.cuentas.set(c.id, c); S.porUser.set(c.plataforma + ':' + c.usuario.toLowerCase(), c); if (c.tipo === 'alberto') S.yo[c.plataforma] = c; }
  await firmar(data.flatMap(c => [c.avatar_url, c.banner_url]));
}
async function cargarMio() {
  const yo = S.yo[S.plat]; if (!yo) return;
  const [l, s, m] = await Promise.all([
    sb.from('likes').select('post_id,comentario_id').eq('cuenta_id', yo.id),
    sb.from('seguimientos').select('seguido').eq('seguidor', yo.id),
    sb.from('mensajes').select('id', { count: 'exact', head: true }).eq('para', yo.id).eq('leido', false),
  ]);
  S.likes = new Set((l.data || []).filter(x => x.post_id).map(x => x.post_id));
  S.likesC = new Set((l.data || []).filter(x => x.comentario_id).map(x => x.comentario_id));
  S.sigo = new Set((s.data || []).map(x => x.seguido));
  S.noLeidos = m.count || 0;
  if (S.yo.of) { const r = await sb.from('mensajes').select('id', { count: 'exact', head: true }).eq('para', S.yo.of.id).eq('leido', false); S.noLeidosOf = r.count || 0; }
}
async function arrancar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaBloqueo();
  if (lsG('aq-pin-h') && !sessionStorage.getItem('aq-ok')) await bloqueoLocal();
  S.email = session.user.email || '';
  const { data: ok, error } = await sb.rpc('es_alberto');
  if (error || !ok) return pantallaBloqueo(`Esta cuenta (${session.user.email}) no tiene acceso.`, true);
  const { data: cfg } = await sb.from('config').select('valor').eq('clave', 'nombre_red').maybeSingle();
  S.red = (cfg?.valor && cfg.valor !== '(sin nombre)') ? cfg.valor : '';
  const { data: cfgs } = await sb.from('config').select('clave,valor').in('clave', ['agenda', 'nocturna', 'vapid_publica', 'nombres']);
  for (const c of cfgs || []) { if (c.clave === 'agenda' && Array.isArray(c.valor)) AGENDA = c.valor; else S[c.clave] = c.valor; }
  if (S.nombres) { const N = S.nombres; if (N.chat) APPS.find(a => a.id === 'hilo').nombre = N.chat; if (N.red) APPS.find(a => a.id === 'vox').nombre = N.red; if (N.nocturna) APPS.find(a => a.id === 'nocturna').nombre = N.nocturna; if (N.movil) document.title = N.movil; }
  if (S.red) APPS.find(a => a.id === 'vox').nombre = S.red;
  await cargarCuentas(); await cargarMio();
  addEventListener('hashchange', ruta);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!S.appAbierta) pintarHome(); else if (/^#\/vox(\/md)?$/.test(location.hash)) ruta(); } });
  pintarHome(); ruta();
}

/* ---------- bloqueo con código de 4 cifras ---------- */
const PIN_PRE = 'aquelarre-pin-';
async function hashPin(pin, uid) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('aq|' + uid + '|' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const lsG = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsS = (k, v) => { try { localStorage.setItem(k, v); } catch { } };

function pantallaBloqueo(error = '', soloSalir = false, local = null) {
  if (!local) { $home.innerHTML = ''; $app.classList.add('oculta'); }
  const d = new Date();
  const b = document.createElement('div'); b.className = 'bloqueo';
  const correo = lsG('aq-correo') || '';
  b.innerHTML = `<div class="fecha">${DIAS[d.getDay()].replace(/^./, c => c.toUpperCase())}, ${d.getDate()} de ${['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()]}</div>
    <div class="hora chica" id="relojB"></div>
    <div class="caja">${soloSalir ? `<div class="err">${esc(error)}</div><button class="btn borde" id="fuera">Salir</button>` : `
      <div class="pinT" id="pt">Introduce tu código</div>
      ${!local && !correo ? `<div class="campo"><label>Correo</label><input id="em" type="email" autocomplete="username" inputmode="email"></div>` : ''}
      <div class="pdots" id="pd"><i></i><i></i><i></i><i></i></div>
      <div class="err" id="er" style="text-align:center">${esc(error)}</div>
      <div class="tecl">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="nada"></button><button data-n="0">0</button><button class="bor" data-b="1">⌫</button></div>
      <div class="pinL">${local ? '<button id="otro">Salir</button>' : '<button id="otro">Crear código nuevo</button>'}</div>
`}
    </div>`;
  $movil.appendChild(b); reloj();
  if (soloSalir) { b.querySelector('#fuera').onclick = async () => { await sb.auth.signOut(); location.reload(); }; return; }
  let modo = local ? 'local' : 'entrar', pin = '', primero = '', fallos = 0, ocupado = false;
  const $pt = b.querySelector('#pt'), $pd = b.querySelector('#pd'), er = m => b.querySelector('#er').textContent = m;
  const em = () => (b.querySelector('#em')?.value || correo).trim();
  const puntos = () => [...$pd.children].forEach((i, k) => i.classList.toggle('on', k < pin.length));
  const mal = m => { er(m); pin = ''; puntos(); $pd.classList.remove('temblor'); void $pd.offsetWidth; $pd.classList.add('temblor'); if (navigator.vibrate) navigator.vibrate(120); };
  const titulo = { entrar: 'Introduce tu código', local: 'Introduce tu código', crear1: 'Elige un código de 4 cifras', crear2: 'Repítelo' };
  const pon = m => { modo = m; $pt.textContent = titulo[m]; pin = ''; puntos(); };
  const cerrar = () => { b.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], { duration: 380, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = () => { b.remove(); document.removeEventListener('keydown', tecla); }; };
  const entrar = async p => {
    if (!em()) { pin = ''; puntos(); return er('Pon tu correo'); }
    const { data, error } = await sb.auth.signInWithPassword({ email: em(), password: PIN_PRE + p });
    if (error) return mal(error.message === 'Invalid login credentials' ? 'Código incorrecto' : error.message);
    lsS('aq-correo', em()); lsS('aq-pin-h', await hashPin(p, data.user.id)); sessionStorage.setItem('aq-ok', '1');
    cerrar(); location.hash = '#/'; arrancar();
  };
  const listo = async () => {
    const p = pin; ocupado = true;
    try {
      if (modo === 'entrar') await entrar(p);
      else if (modo === 'crear1') { primero = p; pon('crear2'); }
      else if (modo === 'crear2') {
        if (p !== primero) { pon('crear1'); return mal('No coinciden, otra vez'); }
        if (!em()) { pon('crear1'); return er('Pon tu correo'); }
        const { data, error } = await sb.rpc('poner_codigo', { correo: em(), codigo: p });
        if (error) { pon('entrar'); return mal(error.message); }
        if (data !== 'ok') { pon('entrar'); return mal('Cambiar el código está cerrado. Pídeselo a Claude.'); }
        pon('entrar'); await entrar(p);
      } else if (modo === 'local') {
        const { data: { session } } = await sb.auth.getSession();
        if (session && await hashPin(p, session.user.id) === lsG('aq-pin-h')) { sessionStorage.setItem('aq-ok', '1'); cerrar(); local(); }
        else if (++fallos >= 5) { await sb.auth.signOut(); location.reload(); }
        else mal('Código incorrecto');
      }
    } finally { ocupado = false; }
  };
  const pulsa = n => { if (ocupado) return; er(''); if (n === 'b') pin = pin.slice(0, -1); else if (pin.length < 4) pin += n; puntos(); if (pin.length === 4) setTimeout(listo, 120); };
  b.querySelectorAll('.tecl button[data-n]').forEach(x => x.onclick = () => pulsa(x.dataset.n));
  b.querySelector('.tecl .bor').onclick = () => pulsa('b');
  const tecla = e => { if (e.target.tagName === 'INPUT') return; if (/^[0-9]$/.test(e.key)) pulsa(e.key); else if (e.key === 'Backspace') pulsa('b'); };
  document.addEventListener('keydown', tecla);
  b.querySelector('#otro').onclick = async () => { if (local) { await sb.auth.signOut(); location.reload(); } else { er(''); pon(modo === 'entrar' ? 'crear1' : 'entrar'); b.querySelector('#otro').textContent = modo === 'entrar' ? 'Crear código nuevo' : 'Ya tengo código'; } };
}
const bloqueoLocal = () => new Promise(res => pantallaBloqueo('', false, res));
let ocultoDesde = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { ocultoDesde = Date.now(); return; }
  if (ocultoDesde && Date.now() - ocultoDesde > 5 * 60e3 && lsG('aq-pin-h') && !document.querySelector('.bloqueo')) bloqueoLocal();
});

    }

function abrirApp(id) {
  if (S.appAbierta === id) return;
  const nueva = !S.appAbierta;
  S.appAbierta = id;
  $app.classList.remove('oculta');

async function ruta() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  const [, app, ...resto] = h.split('/');
  if (!app) return cerrarApp();
  if (!APPS.some(a => a.id === app)) { location.hash = '#/'; return; }
  abrirApp(app);
  try {
    const r = resto.join('/');
    switch (app) {
      case 'vox': {
        let m;
        if (!r) return vistaInicio();
        if ((m = r.match(/^p\/(\d+)$/))) return vistaPost(+m[1]);
        if ((m = r.match(/^u\/([^/]+)\/(seguidores|siguiendo)$/))) return vistaSeguir(m[1], m[2]);
        if ((m = r.match(/^u\/(.*)$/))) return vistaPerfil(m[1]);
        if (r === 'md') return vistaMD();
        if ((m = r.match(/^md\/(.+)$/))) return vistaChat(m[1]);
        return vistaInicio();

      case 'medidor': return vistaConsumo();
      case 'hilo': return r ? vistaHiloChat(r) : vistaHilo();
      case 'agenda': return vistaAgenda();
      case 'ajustes': return vistaAjustes();
            case 'nocturna': { let m; if ((m = r.match(/^c\/(.+)$/))) return vistaNocturna(m[1]); if ((m = r.match(/^md\/(.+)$/))) return vistaNocMD(m[1]); if (r === 'md') return vistaNocChats(); return vistaNocDescubrir(); }

/* ---------- fotos tuyas: a 1600 px y JPEG antes de subirlas (una foto del iPhone pesa 4 MB) ---------- */
async function aligerar(file, lado = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, lado / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch { return file; }
}

function verFoto(src) {
  const v = document.createElement('div'); v.className = 'visor';
  v.innerHTML = `<img src="${esc(src)}" alt=""><div class="vbar"><button id="vc">Cerrar</button><button id="vg">Guardar</button></div>`;

  v.onclick = e => { if (e.target === v || e.target.tagName === 'IMG') v.remove(); };
  v.querySelector('#vg').onclick = async () => {
    try {
      const blob = await (await fetch(src)).blob();
      const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
      const f = new File([blob], 'aquelarre-' + Date.now() + '.' + ext, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); toast('Guardada');
    } catch (err) { if (err.name !== 'AbortError') toast('No se ha podido guardar: mantén pulsada la foto'); }
  };
}

async function vistaConsumo() {
  marco('Medidor', '<div class="cargando">Cargando…</div>', { sub: 'Lo que gastan los modelos de este móvil' });
  const desde = new Date(Date.now() - 7 * 864e5).toISOString();
  const [ult, cfg, sem] = await Promise.all([
    sb.from('consumo').select('*').order('creado', { ascending: false }).limit(30),
    sb.from('config').select('valor').eq('clave', 'tanda').maybeSingle(),
    sb.from('consumo').select('*').gte('creado', desde),
  ]);
  const t = cfg.data?.valor || {};
  const hoyStr = new Date().toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid' });
  const filas = sem.data || [];
  const tot = r => (r.tokens_in || 0) + (r.tokens_out || 0);
  const hoy = filas.filter(r => new Date(r.creado).toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid' }) === hoyStr);
  const hoyT = hoy.reduce((a, r) => a + tot(r), 0), semT = filas.reduce((a, r) => a + tot(r), 0);
  const tandas = filas.filter(r => r.para === 'reacciones' && !r.saltada && !r.error);
  const media = tandas.length ? Math.round(tandas.reduce((a, r) => a + tot(r), 0) / tandas.length) : 0;
  const msMed = tandas.length ? Math.round(tandas.reduce((a, r) => a + (r.duracion_ms || 0), 0) / tandas.length / 1000) : 0;
  const salt = filas.filter(r => r.saltada).length, errs = filas.filter(r => r.error).length;
  const tope = t.tope_diario_tokens || 0, pct = tope ? Math.min(100, hoyT / tope * 100) : 0;
  const porQuien = {}; filas.forEach(r => { porQuien[r.quien] = (porQuien[r.quien] || 0) + tot(r); });
  cont().innerHTML = `
    <div class="tarjetas">
      <div class="tj" style="grid-column:1/-1"><div class="k">Hoy</div><div class="v">${num(hoyT)} tokens</div>
        <div class="barra"><i class="${pct > 80 ? 'alto' : ''}" style="width:${pct}%"></i></div>
        <div class="s">Tope diario: ${num(tope)} · ${Math.round(pct)} % · <a href="#" id="cambiaTope" style="color:#ff8ab8">cambiar</a></div></div>
      <div class="tj"><div class="k">Últimos 7 días</div><div class="v">${num(semT)}</div><div class="s">${filas.length} llamadas</div></div>
      <div class="tj"><div class="k">Media por tanda</div><div class="v">${num(media)}</div><div class="s">${tandas.length} tandas · ${msMed} s de media</div></div>
      <div class="tj"><div class="k">Saltadas por tope</div><div class="v">${salt}</div><div class="s">7 días</div></div>
      <div class="tj"><div class="k">Con error</div><div class="v">${errs}</div><div class="s">7 días</div></div>
    </div>
    <div class="seccion">Por quién (7 días)</div>
    <div style="padding:0 16px"><table>${Object.entries(porQuien).sort((a, b) => b[1] - a[1]).map(([q, n]) => `<tr><td>${esc(q)}</td><td class="num">${num(n)}</td></tr>`).join('') || '<tr><td style="color:var(--tx2)">Nada todavía</td></tr>'}</table></div>
    <div class="seccion">Últimas llamadas</div>
    <div style="padding:0 16px 24px;overflow-x:auto"><table>
      <tr><th>Cuándo</th><th>Quién</th><th>Para</th><th class="num">Entrada</th><th class="num">Salida</th><th class="num">s</th></tr>
      ${(ult.data || []).map(r => `<tr title="${esc(r.error || r.nota || '')}"><td>${hace(r.creado)}</td><td>${esc(r.quien)}</td><td>${esc(r.para)}${r.saltada ? ' · saltada' : ''}${r.error ? ' · <span style="color:#f4212e">error</span>' : ''}</td><td class="num">${num(r.tokens_in)}</td><td class="num">${num(r.tokens_out)}</td><td class="num">${r.duracion_ms ? Math.round(r.duracion_ms / 1000) : ''}</td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--tx2)">Aún no hay llamadas registradas.</td></tr>'}
    </table>
    <p class="aviso">Modelo de las reacciones: ${esc(t.modelo || '?')} · tanda ${t.activa === false ? 'parada' : 'activa'} · máx. ${t.max_posts_por_tanda || '?'} posts por tanda.</p></div>`;

/* ---------- Agenda ---------- */
function vistaAgenda() {
  const hoy = new Date();
  let html = '';
  for (let k = 0; k < 7; k++) {
    const d = new Date(hoy); d.setDate(d.getDate() + k);
    const evs = AGENDA.filter(e => e.dia === d.getDay());
    html += `<div class="dia ${k === 0 ? 'hoy' : ''}">${k === 0 ? 'Hoy' : k === 1 ? 'Mañana' : DIAS[d.getDay()]} · ${d.getDate()} ${MES[d.getMonth()]}</div>`;
    html += evs.map(e => `<div class="evento" style="--c:${e.c}"><span class="h">${e.hora}</span><div><b>${e.quien}</b><div style="color:var(--tx2)">${e.que}</div></div></div>`).join('') || '<div style="padding:4px 16px 8px;color:#444">—</div>';
  }
  marco('', `<div class="titulo-grande">Agenda</div>${html}<p class="aviso" style="padding:0 16px">Horarios provisionales: los acabarán poniendo ellas.</p>`, { top: false });
}

const eur = n => (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const CANDADO = '<svg viewBox="0 0 24 24"><path d="M12 1.5a5 5 0 0 0-5 5V9H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6.5a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0V9H9V6.5zm3 7a2 2 0 0 1 1 3.73V19h-2v-1.77A2 2 0 0 1 12 13.5z"/></svg>';
async function datosNoc(usuario = 'veenoir') {
  const val = [...S.cuentas.values()].find(c => c.plataforma === 'of' && c.usuario === usuario && c.tipo !== 'alberto');
  const yo = S.yo.of;
  if (!val || !yo) return null;
  const ahora = new Date().toISOString();
  const [sus, todas, des, prop, posts, lk] = await Promise.all([
    sb.from('suscripciones').select('*').eq('creadora', val.id).gt('hasta', ahora).order('hasta', { ascending: false }).limit(1),
    sb.from('suscripciones').select('precio'),
    sb.from('desbloqueos').select('post_id,mensaje_id,precio'),
    sb.from('propinas').select('importe'),
    sb.from('v_posts2').select('*').eq('cuenta_id', val.id).is('repost_de', null).order('creado', { ascending: false }).limit(80),
    sb.from('likes').select('post_id').eq('cuenta_id', yo.id),
  ]);
  const D = des.data || [];
  const gastado = [...(todas.data || []).map(x => +x.precio), ...D.map(x => +x.precio), ...(prop.data || []).map(x => +x.importe)].reduce((a, b) => a + b, 0);
  const P = posts.data || [];
  await firmar(P.map(p => p.imagen_url));
  return { val, yo, sus: sus.data?.[0] || null, desP: new Set(D.filter(d => d.post_id).map(d => d.post_id)), desM: new Set(D.filter(d => d.mensaje_id).map(d => d.mensaje_id)), posts: P, likes: new Set((lk.data || []).map(x => x.post_id)), gastado };
}

function hoja(html) {

function pagar(titulo, detalle, importe, alPagar) {

  m.querySelector('#nop').onclick = () => m.remove();
  m.querySelector('#okp').onclick = async () => { m.querySelector('#okp').disabled = true; const err = await alPagar(); if (err) { toast(err.message || err); m.querySelector('#okp').disabled = false; return; } m.remove(); };

function propina(N, postId, alAcabar) {
  let imp = 5;
  const m = hoja(`<h3>Propina para ${esc(N.val.nombre)}</h3><div class="p">Dinero de mentira.${N.val.tipo === 'hermana' ? ' Ella lo ve en su resumen.' : ''}</div>
    <div class="importes">${[3, 5, 10, 20].map(v => `<button data-v="${v}" class="${v === imp ? 'on' : ''}">${v} €</button>`).join('')}</div>
    <div class="campo"><label>Mensaje (opcional)</label><input id="pm" maxlength="200"></div>
    <button class="btn azul" style="width:100%;height:46px" id="okp">Enviar propina</button>`);
  m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { imp = +b.dataset.v; m.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); m.querySelector('#okp').textContent = `Enviar ${imp} €`; });
  m.querySelector('#okp').onclick = async () => {
    const txt = m.querySelector('#pm').value.trim();
    const r1 = await sb.from('propinas').insert({ para: N.val.id, post_id: postId || null, importe: imp, mensaje: txt || null });
    if (r1.error) return toast(r1.error.message);
    await sb.from('mensajes').insert({ plataforma: 'of', de: N.yo.id, para: N.val.id, texto: txt || 'propina', propina: imp, origen: 'web' });
    m.remove(); toast(`Propina de ${imp} € enviada`); alAcabar && alAcabar();

}
function mediaNoc(p, N) {
  const img = p.imagen_url && S.urls.get(p.imagen_url);
  const visible = p.de_pago ? N.desP.has(p.id) : !!N.sus;
  if (visible) {
    if (img) return `<img class="nocimg" src="${esc(img)}" alt="" loading="lazy">`;
    if (p.media_n || p.oculto || p.de_pago) return `<div class="noimg"><span>${p.media_n ? p.media_n + ' fotos · ' : ''}pendientes de hoja aprobada</span>${p.oculto ? `<p>${esc(p.oculto)}</p>` : ''}</div>`;
    return '';
  }
  if (!p.de_pago && !img && !p.media_n) return '';
  return `<div class="bloq" ${p.de_pago ? `data-desb="${p.id}"` : 'data-sus="1"'}>${img ? `<img src="${esc(img)}" alt="">` : '<div class="manchas"></div>'}
    <div class="candado">${CANDADO}<b>${p.de_pago ? 'Desbloquear · ' + eur(p.precio) : 'Suscríbete para verlo'}</b>${p.media_n ? `<span>${p.media_n} fotos</span>` : ''}</div></div>`;
}
async function vistaNocturna(usuario = 'veenoir') {

  const fotos = N.posts.reduce((a, p) => a + (p.media_n || (p.imagen_url ? 1 : 0)), 0);
  const likes = N.posts.reduce((a, p) => a + crece(p.likes_sim, p.creado, 4) + (N.likes.has(p.id) ? 1 : 0), 0);
  const ban = N.val.banner_url && S.urls.get(N.val.banner_url);
  const c = N.val;
  cont().innerHTML = `
    <div class="ban" style="margin-top:0">${ban ? `<img src="${esc(ban)}" alt="">` : ''}<div class="stats" style="padding-top:var(--st)">${N.posts.length} posts · ${fotos} fotos · ${num(likes)} me gusta</div></div>

    ${c.bio ? `<div class="bio">${esc(c.bio)}</div>` : ''}
    <div class="sus">${N.sus
      ? `<div class="k">Suscrito</div><div style="margin-top:4px">Se renueva el ${new Date(N.sus.hasta).getDate()} ${MES[new Date(N.sus.hasta).getMonth()]}</div>
         ${c.usuario === 'veenoir' && S.nocturna?.bienvenida ? `<div style="margin-top:8px;color:#ffc2da;font-style:italic">«${esc(S.nocturna.bienvenida)}»</div>` : ''}
         <div class="fila-btn"><a class="btn-n" href="#/nocturna/md/${esc(c.usuario)}">Mensaje</a><button class="btn-n borde" id="tip">Propina</button></div>`
      : `<div class="k">Suscripción</div><button class="btn-n" id="sus"><span>SUSCRÍBETE</span><span>${eur(precio)} al mes</span></button>`}
    </div>
    <div class="gasto">Llevas gastado ${eur(N.gastado)} (de mentira)</div>
    <div id="muro">${N.posts.map(p => `<article class="nocp">
      <div class="cab">${avatar(c)}<span class="n">${esc(c.nombre)}</span>${verif(c)}<span class="t">· ${hace(p.creado)}</span>${p.de_pago ? `<span class="t" style="margin-left:auto;color:#ff8ab8">${eur(p.precio)}</span>` : ''}</div>
      ${p.texto ? `<div class="tx">${esc(p.texto)}</div>` : ''}
      ${mediaNoc(p, N)}
      <div class="acc"><button class="lk ${N.likes.has(p.id) ? 'on' : ''}" data-lko="${p.id}">${svg(N.likes.has(p.id) ? 'lkOn' : 'lk')}<span>${num(crece(p.likes_sim, p.creado, 4) + (N.likes.has(p.id) ? 1 : 0))}</span></button>
        <button data-tipp="${p.id}" style="font-weight:600">${eur(0).replace('0,00 ', '')} Propina</button></div>
    </article>`).join('') || '<div class="vacio">Aún no ha subido nada.</div>'}</div>`;
  const recargar = () => vistaNocturna(usuario);
  const bs = document.getElementById('sus');
  if (bs) bs.onclick = () => pagar('Suscribirte a ' + esc(c.nombre), 'Un mes. Se renueva solo… de mentira.', precio, async () => {

    if (r.error) return r.error; toast('Suscrito'); recargar();

    const t = e.target.closest('[data-desb],[data-sus],[data-lko],[data-tipp]'); if (!t) return;
    if (t.dataset.sus) return document.getElementById('sus')?.click();

async function vistaNocMD(usuario = 'veenoir') {
  marco('', '<div class="cargando">Cargando…</div>', { top: false, nav: navNoc() });

  if (!N) return cont().innerHTML = '<div class="vacio">Sin cuenta.</div>';
  const { data } = await sb.from('mensajes').select('*').eq('plataforma', 'of')
    .or(`and(de.eq.${N.yo.id},para.eq.${N.val.id}),and(de.eq.${N.val.id},para.eq.${N.yo.id})`).order('creado');
  const msgs = data || [];
  await firmar(msgs.map(m => m.imagen_url));
  const nuevos = msgs.filter(m => m.para === N.yo.id && !m.leido).map(m => m.id);
  if (nuevos.length) { await sb.from('mensajes').update({ leido: true }).in('id', nuevos); S.noLeidosOf = 0; }

  marco(esc(N.val.nombre), '', { atras: true, sub: '@' + esc(N.val.usuario) + ' · Nocturna', clase: 'chatfondo' });

  };
  const main = cont();
  main.innerHTML = `<div class="burbujas">${msgs.map(burb).join('') || `<div class="vacio">${N.sus ? 'Escríbele algo.' : 'Suscríbete para escribirle.'}</div>`}</div>`;
  main.scrollTop = main.scrollHeight;
  main.onclick = e => {
    const t = e.target.closest('[data-desm]'); if (!t) return;
    const m = msgs.find(x => x.id === +t.dataset.desm);
    pagar('Desbloquear mensaje', esc(m.texto || ''), m.precio, async () => { const r = await sb.from('desbloqueos').insert({ mensaje_id: m.id, precio: m.precio }); if (r.error) return r.error; vistaNocMD(usuario); });
  };
  if (N.sus) {
    const e = document.createElement('div'); e.className = 'escribir';
    e.innerHTML = `<button class="btn borde" id="mtip" style="padding:0 12px">€</button><textarea id="mtx" rows="1" placeholder="Mensaje"></textarea><button class="btn azul" id="menv">Enviar</button>`;
    $app.insertBefore(e, document.getElementById('btCasa'));
    document.getElementById('mtip').onclick = () => propina(N, null, () => vistaNocMD(usuario));
    document.getElementById('menv').onclick = async () => {
      const t = document.getElementById('mtx').value.trim(); if (!t) return;
      const { error } = await sb.from('mensajes').insert({ plataforma: 'of', de: N.yo.id, para: N.val.id, texto: t, origen: 'web' });
      if (error) return toast(error.message);
      vistaNocMD(usuario);
    };
  }
}

  const { data } = await sb.from('posts').select('id,cuenta_id,imagen_url,plataforma,de_pago,creado').in('cuenta_id', her.length ? her : ['00000000-0000-0000-0000-000000000000']).not('imagen_url', 'is', null).order('creado', { ascending: false }).limit(120);
  const N = S.yo.of ? await datosNoc() : null;
  const vis = (data || []).filter(p => p.imagen_url).filter(p => p.plataforma !== 'of' || (p.de_pago ? N?.desP.has(p.id) : !!N?.sus));
  await firmar(vis.map(p => p.imagen_url));
  cont().innerHTML = `<div class="titulo-grande">Galería</div>` + (vis.length
    ? `<div class="cuad" style="margin-top:8px">${vis.map(p => `<a href="${p.plataforma === 'of' ? '#/nocturna' : R + '/p/' + p.id}"><img src="${esc(S.urls.get(p.imagen_url))}" loading="lazy" alt=""></a>`).join('')}</div>`
    : '<div class="vacio">Aquí salen las fotos que publiquen ellas en Vox y lo que desbloquees en Nocturna.</div>');
}

/* ---------- Avisos al iPhone ---------- */
const b64u8 = b => { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function estadoAvisos() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'no';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'si' : 'off';
}
async function activarAvisos() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('Aquí no hay avisos: ábrelo desde la pantalla de inicio del iPhone');
  if (!S.vapid_publica) return toast('Falta la clave de avisos en el servidor');
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  if (await Notification.requestPermission() !== 'granted') return toast('Sin permiso para avisos');
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(S.vapid_publica) });
  const j = sub.toJSON();
  const { error } = await sb.from('push_subs').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
  if (error) return toast(error.message);
  toast('Avisos activados'); vistaAjustes();
}
async function desactivarAvisos() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  if (sub) { await sb.from('push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  toast('Avisos desactivados'); vistaAjustes();
}

}
