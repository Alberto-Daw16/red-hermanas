  return `<div class="${cls}" style="background:${COLORES[h % COLORES.length]}">${esc((c.nombre || c.usuario).replace(/[^\p{L}\p{N}]/gu, '').charAt(0).toUpperCase() || '?')}</div>`;
}
function toast(m) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function firmar(rutas) {
  const falta = [...new Set(rutas.filter(r => r && !S.urls.has(r)))];
  const ext = falta.filter(r => /^https?:/.test(r)); ext.forEach(r => S.urls.set(r, r));
  const priv = falta.filter(r => !/^https?:/.test(r));
  if (!priv.length) return;
  const { data } = await sb.storage.from('media').createSignedUrls(priv, 60 * 60 * 12);
  (data || []).forEach(d => d.signedUrl && S.urls.set(d.path, d.signedUrl));
}
const cuenta = id => S.cuentas.get(id);

/* ---------- arranque ---------- */
async function cargarCuentas() {
  const { data, error } = await sb.from('cuentas').select('*').order('creado');
  if (error) throw error;
  S.cuentas.clear(); S.porUser.clear();
  for (const c of data) { S.cuentas.set(c.id, c); S.porUser.set(c.plataforma + ':' + c.usuario.toLowerCase(), c); if (c.tipo === 'alberto') S.yo[c.plataforma] = c; }
  await firmar(data.flatMap(c => [c.avatar_url, c.banner_url]));
}
async function cargarMio() {
  const yo = S.yo[S.plat]; if (!yo) return;
  const [l, s, m] = await Promise.all([
    sb.from('likes').select('post_id,comentario_id').eq('cuenta_id', yo.id),
    sb.from('seguimientos').select('seguido').eq('seguidor', yo.id),
    sb.from('mensajes').select('id', { count: 'exact', head: true }).eq('para', yo.id).eq('leido', false),
  ]);
  S.likes = new Set((l.data || []).filter(x => x.post_id).map(x => x.post_id));
  S.likesC = new Set((l.data || []).filter(x => x.comentario_id).map(x => x.comentario_id));
  S.sigo = new Set((s.data || []).map(x => x.seguido));
  S.noLeidos = m.count || 0;
}
async function arrancar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaLogin();
  const { data: ok, error } = await sb.rpc('es_alberto');
  if (error || !ok) {
    $app.innerHTML = `<div class="login"><h2>Sin acceso</h2><p class="aviso">Esta cuenta (${esc(session.user.email)}) no tiene permiso para entrar.</p><button class="btn borde" id="fuera">Salir</button></div>`;
    document.getElementById('fuera').onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  const { data: cfg } = await sb.from('config').select('valor').eq('clave', 'nombre_red').maybeSingle();
  S.red = (cfg?.valor && cfg.valor !== '(sin nombre)') ? cfg.valor : '';
  document.title = S.red || 'Red';
  await cargarCuentas(); await cargarMio();
  window.addEventListener('hashchange', ruta);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && /^#?\/?$|^#\/md/.test(location.hash)) ruta(); });
  ruta();
}

/* ---------- marco ---------- */
function marco(titulo, html, { atras = false, plats = false, sub = '', extra = '' } = {}) {
  const h = location.hash || '#/';
  const nav = (r, ico, on, badge = '') => `<a href="${r}" class="${on ? 'on' : ''}">${svg(ico)}${badge}</a>`;
  $app.innerHTML = `
  <div class="top"><div class="fila">
    ${atras ? `<button class="atras" onclick="history.length>1?history.back():location.hash='#/'">${svg('atras')}</button>` : ''}
    <h1>${titulo}${sub ? `<div class="sub">${sub}</div>` : ''}</h1>${extra}
  </div>
  ${plats ? `<div class="plats">${[['x', 'X'], ['ig', 'Instagram'], ['of', 'OnlyFans']].map(([k, n]) => `<button data-plat="${k}" class="${S.plat === k ? 'on' : ''}">${n}</button>`).join('')}</div>` : ''}
  </div>
  <main id="main">${html}</main>
  <nav class="nav"><div class="in">
    ${nav('#/', 'casa', h === '#/' || h === '#' || h === '')}
    ${nav('#/md', 'sobre', h.startsWith('#/md'), S.noLeidos ? `<span class="punto">${S.noLeidos}</span>` : '')}
    ${nav('#/consumo', 'grafica', h.startsWith('#/consumo'))}
    ${nav('#/u/' + (S.yo[S.plat]?.usuario || S.yo.x?.usuario || ''), 'persona', h === '#/u/' + (S.yo[S.plat]?.usuario || ''))}
  </div></nav>`;
  $app.querySelectorAll('[data-plat]').forEach(b => b.onclick = () => { S.plat = b.dataset.plat; ruta(); });
}

async function ruta() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  window.scrollTo(0, 0);
  try {
    let m;
    if (h === '/' || h === '') return vistaInicio();
    if ((m = h.match(/^\/p\/(\d+)$/))) return vistaPost(+m[1]);
    if ((m = h.match(/^\/u\/(.*)$/))) return vistaPerfil(m[1]);
    if (h === '/md') return vistaMD();
    if ((m = h.match(/^\/md\/(.+)$/))) return vistaChat(m[1]);
    if (h === '/consumo') return vistaConsumo();
    location.hash = '#/';
  } catch (e) {
    console.error(e);
    marco('Error', `<div class="vacio">${esc(e.message || e)}</div>`, { atras: true });
  }
}

/* ---------- posts ---------- */
async function traerPosts(q) {
  const { data, error } = await q;
  if (error) throw error;
  const ids = [...new Set(data.map(p => p.repost_de).filter(Boolean))].filter(id => !data.some(p => p.id === id));
  let orig = [];
  if (ids.length) { const r = await sb.from('v_posts').select('*').in('id', ids); orig = r.data || []; }
  const todos = new Map([...data, ...orig].map(p => [p.id, p]));
  await firmar([...todos.values()].map(p => p.imagen_url));
  const yo = S.yo[S.plat];
  if (yo) S.mios = new Set(data.filter(p => p.cuenta_id === yo.id && p.repost_de && !p.cita).map(p => p.repost_de));
  return { lista: data, todos };
}

function encuesta(p) {
  const e = p.encuesta; if (!e?.opciones) return '';
  const votos = e.votos || e.opciones.map(() => 0), total = votos.reduce((a, b) => a + b, 0);
  const cerrada = e.cierra && new Date(e.cierra) < new Date();
  const votada = e.voto_alberto != null || cerrada;
  const max = Math.max(...votos);
  return `<div class="enc" data-stop>${e.opciones.map((o, i) => votada
    ? `<div class="op ${votos[i] === max ? 'win' : ''}"><i class="b" style="width:${total ? votos[i] / total * 100 : 0}%"></i><span>${esc(o)}${e.voto_alberto === i ? ' ✓' : ''}</span><span>${total ? Math.round(votos[i] / total * 100) : 0}%</span></div>`
    : `<button class="op votar" data-votar="${p.id}" data-i="${i}">${esc(o)}</button>`).join('')}
    <div class="pie">${num(total)} votos · ${cerrada ? 'Resultados finales' : e.cierra ? 'Quedan ' + quedan(e.cierra) : 'Encuesta'}</div></div>`;
}

function htmlPost(p, todos, { detalle = false } = {}) {
  let rtDe = '';
  let base = p;
  if (p.repost_de && !p.cita) {
    const quien = cuenta(p.cuenta_id);
    rtDe = `<div class="rt">${svg('rp')}${esc(quien?.nombre || '')} ha reposteado</div>`;
    base = todos.get(p.repost_de); if (!base) return '';
  }
  const c = cuenta(base.cuenta_id) || { nombre: '?', usuario: '?' };
  const citada = base.cita && base.repost_de && todos.get(base.repost_de);
  const img = base.imagen_url && S.urls.get(base.imagen_url);
  const lkOn = S.likes.has(base.id), rpOn = S.mios.has(base.id);
  const cuerpo = `
    ${base.texto ? `<div class="tx">${texto(base.texto)}</div>` : ''}
    ${img ? `<div class="media"><img src="${esc(img)}" alt="" loading="lazy"></div>` : ''}
    ${encuesta(base)}
    ${citada ? `<div class="cita" data-ir="${citada.id}"><div class="cab">${avatar(cuenta(citada.cuenta_id))}<span class="n">${esc(cuenta(citada.cuenta_id)?.nombre)}</span><span class="u">@${esc(cuenta(citada.cuenta_id)?.usuario)}</span><span class="t">· ${hace(citada.creado)}</span></div><div class="tx">${texto(citada.texto || '')}</div></div>` : ''}`;
  const acciones = `<div class="acc" data-stop>
      <button data-ir="${base.id}">${svg('resp')}<span>${base.n_comentarios ? num(base.n_comentarios) : ''}</span></button>
      <button class="rp ${rpOn ? 'on' : ''}" data-rp="${base.id}">${svg('rp')}<span>${base.n_reposts ? num(base.n_reposts) : ''}</span></button>
      <button class="lk ${lkOn ? 'on' : ''}" data-lk="${base.id}">${svg(lkOn ? 'lkOn' : 'lk')}<span>${base.n_likes ? num(base.n_likes) : ''}</span></button>
      <button>${svg('vistas')}<span>${base.vistas_sim ? num(base.vistas_sim) : ''}</span></button>
    </div>`;
  if (detalle) {
    return `<div class="det" style="padding:12px 16px 0;border-bottom:1px solid var(--line)">
      <a class="cab" href="#/u/${esc(c.usuario)}" style="gap:10px">${avatar(c)}<div style="min-width:0"><div class="cab"><span class="n">${esc(c.nombre)}</span>${verif(c)}</div><div class="cab"><span class="u">@${esc(c.usuario)}</span></div></div></a>
      ${cuerpo}
      <div class="meta">${fechaLarga(base.creado)} · <b style="color:var(--tx)">${num(base.vistas_sim)}</b> visualizaciones</div>
      <div class="cifras"><span><b>${num(base.n_reposts)}</b> reposts</span><span><b>${num(base.n_likes)}</b> me gusta</span></div>
      ${acciones}</div>`;
  }
  return `${rtDe}<article class="post" data-ir="${base.id}">
    <a href="#/u/${esc(c.usuario)}" data-stop>${avatar(c)}</a>
    <div class="cuerpo">
      <div class="cab"><span class="n">${esc(c.nombre)}</span>${verif(c)}<span class="u">@${esc(c.usuario)}</span><span class="t">· ${hace(base.creado)}</span></div>
      ${cuerpo}${acciones}
    </div></article>`;
}

function enganchar(root, recargar) {
  root.onclick = async ev => {
    const t = ev.target.closest('[data-lk],[data-rp],[data-votar],[data-lkc],[data-respc],[data-ir],a');
    if (!t) return;
    if (t.tagName === 'A') return; // enlaces normales
    ev.preventDefault(); ev.stopPropagation();
    const yo = S.yo[S.plat]; if (!yo) return toast('No tienes cuenta en esta plataforma');
    if (t.dataset.lk) {
      const id = +t.dataset.lk, on = S.likes.has(id);
      const span = t.querySelector('span'); const n = parseInt((span.textContent || '0').replace(/\./g, '')) || 0;
      if (on) { S.likes.delete(id); await sb.from('likes').delete().eq('cuenta_id', yo.id).eq('post_id', id); }
      else { S.likes.add(id); await sb.from('likes').insert({ cuenta_id: yo.id, post_id: id }); }
      t.classList.toggle('on', !on); t.querySelector('svg').innerHTML = I[!on ? 'lkOn' : 'lk'];
      if (!span.textContent.includes('mil')) span.textContent = num(n + (on ? -1 : 1)) || '';
      return;
    }
    if (t.dataset.rp) {
      const id = +t.dataset.rp, on = S.mios.has(id);
      if (on) { await sb.from('posts').delete().eq('cuenta_id', yo.id).eq('repost_de', id).eq('cita', false); S.mios.delete(id); toast('Repost deshecho'); }
      else {
        const cita = confirm('¿Citar con un comentario? (Cancelar = repost normal)');
        if (cita) return redactar({ citaDe: id, alAcabar: recargar });
        await sb.from('posts').insert({ cuenta_id: yo.id, plataforma: S.plat, repost_de: id, origen: 'web' }); S.mios.add(id); toast('Reposteado');
      }
      return recargar();
    }
    if (t.dataset.votar) {
      const id = +t.dataset.votar, i = +t.dataset.i;
      const { data: p } = await sb.from('posts').select('encuesta').eq('id', id).single();
      const e = p.encuesta; e.votos = e.votos || e.opciones.map(() => 0); e.votos[i]++; e.voto_alberto = i;
      await sb.from('posts').update({ encuesta: e }).eq('id', id);
      return recargar();
    }
    if (t.dataset.lkc) {
      const id = +t.dataset.lkc, on = S.likesC.has(id);
      if (on) { S.likesC.delete(id); await sb.from('likes').delete().eq('cuenta_id', yo.id).eq('comentario_id', id); }
      else { S.likesC.add(id); await sb.from('likes').insert({ cuenta_id: yo.id, comentario_id: id }); }
      return recargar();
    }
    if (t.dataset.respc) { const ta = document.getElementById('resptx'); ta.dataset.a = t.dataset.respc; ta.placeholder = 'Responder a @' + t.dataset.u; ta.focus(); return; }
    if (t.dataset.ir) location.hash = '#/p/' + t.dataset.ir;
  };
}

function proximamente(nombre, fase) {
  return `<div class="vacio"><h2>${nombre}</h2>Llega en la fase ${fase}. De momento la red es solo X.</div>`;
}

async function vistaInicio() {
  const titulo = S.red || 'Inicio';
  if (S.plat !== 'x') return marco(titulo, proximamente(S.plat === 'ig' ? 'Instagram' : 'OnlyFans', S.plat === 'ig' ? 2 : 4), { plats: true });
  marco(titulo, '<div class="cargando">Cargando…</div>', { plats: true, extra: `<button class="atras" id="rec">${svg('recarga')}</button>` });
  document.getElementById('rec').onclick = () => { S.limite = 40; ruta(); };
  const { lista, todos } = await traerPosts(sb.from('v_posts').select('*').eq('plataforma', 'x').order('creado', { ascending: false }).limit(S.limite));
  const main = document.getElementById('main');
  main.innerHTML = (lista.length ? lista.map(p => htmlPost(p, todos)).join('') : '<div class="vacio"><h2>Nada todavía</h2>Cuando publiquen, sale aquí.</div>')
    + (lista.length >= S.limite ? '<button class="mas" id="mas">Ver más</button>' : '');
  enganchar(main, vistaInicio);
  const mas = document.getElementById('mas'); if (mas) mas.onclick = e => { e.stopPropagation(); S.limite += 40; vistaInicio(); };
  fab();
}

function fab() {
  if (!S.yo[S.plat]) return;
  const b = document.createElement('button'); b.className = 'fab'; b.innerHTML = svg('pluma');
  b.onclick = () => redactar({ alAcabar: ruta });
  document.getElementById('main').appendChild(b);
}

function redactar({ citaDe = null, alAcabar }) {
  const yo = S.yo[S.plat];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="fila"><button id="cx">Cancelar</button><button class="btn azul" id="pub" disabled>Publicar</button></div>
    <div class="red">${avatar(yo)}<textarea id="tx" placeholder="${citaDe ? 'Añade un comentario' : '¿Qué está pasando?'}" maxlength="560"></textarea></div>
    <div class="cnt" id="cnt">280</div>`;
  document.body.appendChild(m);
  const tx = m.querySelector('#tx'), pub = m.querySelector('#pub'), cnt = m.querySelector('#cnt');
  tx.focus();
  tx.oninput = () => { const r = 280 - tx.value.length; cnt.textContent = r; cnt.classList.toggle('mal', r < 0); pub.disabled = !tx.value.trim() || r < 0; };
  m.querySelector('#cx').onclick = () => m.remove();

    pub.disabled = true;
    const fila = { cuenta_id: yo.id, plataforma: S.plat, texto: tx.value.trim(), origen: 'web' };

    const { error } = await sb.from('posts').insert(fila);
    if (error) { pub.disabled = false; return toast(error.message); }
    m.remove(); toast('Publicado'); alAcabar && alAcabar();
  };
}

async function vistaPost(id) {
  marco('Post', '<div class="cargando">Cargando…</div>', { atras: true });
  const { lista, todos } = await traerPosts(sb.from('v_posts').select('*').eq('id', id));

  if (ids.length) { const r = await sb.from('likes').select('comentario_id').in('comentario_id', ids); (r.data || []).forEach(x => lc.set(x.comentario_id, (lc.get(x.comentario_id) || 0) + 1)); }
  const porId = new Map((com || []).map(c => [c.id, c]));
  const autor = cuenta(base.cuenta_id);

    const k = cuenta(c.cuenta_id) || { nombre: '?', usuario: '?' };

    return `<article class="post"><a href="#/u/${esc(k.usuario)}">${avatar(k)}</a><div class="cuerpo">
      <div class="cab"><span class="n">${esc(k.nombre)}</span>${verif(k)}<span class="u">@${esc(k.usuario)}</span><span class="t">· ${hace(c.creado)}</span></div>
      <div class="enresp">En respuesta a <a href="#/u/${esc(a?.usuario)}">@${esc(a?.usuario)}</a></div>
      <div class="tx">${texto(c.texto)}</div>
      <div class="acc"><button data-respc="${c.id}" data-u="${esc(k.usuario)}">${svg('resp')}</button><button>${svg('rp')}</button>
      <button class="lk ${on ? 'on' : ''}" data-lkc="${c.id}">${svg(on ? 'lkOn' : 'lk')}<span>${n ? num(n) : ''}</span></button><button>${svg('vistas')}</button></div>

  };
  const main = document.getElementById('main');
  main.innerHTML = htmlPost(base, todos, { detalle: true }) +
    (S.yo[S.plat] ? `<div class="resp">${avatar(S.yo[S.plat])}<textarea id="resptx" placeholder="Postea tu respuesta" rows="1"></textarea><button class="btn azul" id="enviar">Responder</button></div>` : '') +
    (com || []).map(htmlC).join('');
  enganchar(main, () => vistaPost(id));

  if (env) env.onclick = async e => {
    e.stopPropagation();
    const ta = document.getElementById('resptx'); const t = ta.value.trim(); if (!t) return;
    env.disabled = true;
    const { error } = await sb.from('comentarios').insert({ post_id: base.id, cuenta_id: S.yo[S.plat].id, texto: t, responde_a: ta.dataset.a ? +ta.dataset.a : null, origen: 'web' });
    if (error) { env.disabled = false; return toast(error.message); }
    vistaPost(id);
  };
}

    <div class="fila1">${avatar(c, 'av avg')}
      <div style="display:flex;gap:8px">${esYo ? '<button class="btn borde" id="editar">Editar perfil</button>'
      : `<a class="btn borde" href="#/md/${c.id}" style="width:36px;padding:0">${svg('sobre')}</a><button class="btn ${sigo ? 'borde' : ''}" id="seguir">${sigo ? 'Siguiendo' : 'Seguir'}</button>`}</div></div>
    <div class="info">
      <div class="nombre">${esc(c.nombre)}${verif(c)}</div>
      <div class="u">@${esc(c.usuario)}</div>
      ${c.bio ? `<div class="bio">${texto(c.bio)}</div>` : ''}
      <div class="datos">${c.ubicacion ? `<span>${esc(c.ubicacion)}</span>` : ''}</div>
      <div class="datos" style="margin-top:8px"><span><b>${num((c.siguiendo || 0) + (sigs.count || 0))}</b> Siguiendo</span><span><b>${num((c.seguidores || 0) + (segs.count || 0))}</b> Seguidores</span></div>
    </div>
    <div class="tabs"><button class="on">Posts</button></div>
  </div><div id="lista">${postsR.lista.map(p => htmlPost(p, postsR.todos)).join('') || '<div class="vacio">Aún no ha publicado nada.</div>'}</div>`;
  enganchar(document.getElementById('lista'), () => vistaPerfil(usuario));
  const sg = document.getElementById('seguir');
  if (sg) sg.onclick = async () => {
    const yo = S.yo[S.plat]; if (!yo) return;
    if (sigo) { await sb.from('seguimientos').delete().eq('seguidor', yo.id).eq('seguido', c.id); S.sigo.delete(c.id); }
    else { await sb.from('seguimientos').insert({ seguidor: yo.id, seguido: c.id }); S.sigo.add(c.id); }
    vistaPerfil(usuario);
  };
  const ed = document.getElementById('editar');
  if (ed) ed.onclick = () => editarPerfil(c);
}

function editarPerfil(c) {
  const m = document.createElement('div'); m.className = 'modal edit';
  m.innerHTML = `<div class="fila"><button id="cx">Cancelar</button><b>Editar perfil</b><button class="btn" id="ok">Guardar</button></div>
    <div class="campo"><label>Nombre</label><input id="n" value="${esc(c.nombre)}" maxlength="50"></div>
    <div class="campo"><label>Usuario (sin @)</label><input id="u" value="${esc(c.usuario)}" maxlength="30" autocapitalize="off"></div>
    <div class="campo"><label>Biografía</label><textarea id="b" rows="3" maxlength="160" style="width:100%">${esc(c.bio || '')}</textarea></div>
    <div class="campo"><label>Ubicación</label><input id="l" value="${esc(c.ubicacion || '')}" maxlength="30"></div>`;
  document.body.appendChild(m);
  m.querySelector('#cx').onclick = () => m.remove();
  m.querySelector('#ok').onclick = async () => {
    const u = m.querySelector('#u').value.trim().replace(/^@/, '');
    if (!/^\w{2,30}$/.test(u)) return toast('Usuario: letras, números y _');
    const { error } = await sb.from('cuentas').update({ nombre: m.querySelector('#n').value.trim() || c.nombre, usuario: u, bio: m.querySelector('#b').value.trim(), ubicacion: m.querySelector('#l').value.trim() }).eq('id', c.id);
    if (error) return toast(error.code === '23505' ? 'Ese usuario ya existe' : error.message);
    m.remove(); await cargarCuentas(); location.hash = '#/u/' + u; ruta();
  };
}

/* ---------- MD ---------- */
async function vistaMD() {
  if (S.plat !== 'x') return marco('Mensajes', proximamente('Mensajes', S.plat === 'ig' ? 2 : 4), { plats: true });
  marco('Mensajes', '<div class="cargando">Cargando…</div>', { plats: true });
  const yo = S.yo.x;
  const { data, error } = await sb.from('mensajes').select('*').eq('plataforma', 'x').or(`de.eq.${yo.id},para.eq.${yo.id}`).order('creado', { ascending: false }).limit(500);
  if (error) throw error;
  const convs = new Map();
  for (const m of data) { const otro = m.de === yo.id ? m.para : m.de; if (!convs.has(otro)) convs.set(otro, { ult: m, nuevos: 0 }); if (m.para === yo.id && !m.leido) convs.get(otro).nuevos++; }
  document.getElementById('main').innerHTML = [...convs].map(([id, v]) => {
    const c = cuenta(id) || { nombre: '?', usuario: '?' };
    return `<a class="conv ${v.nuevos ? 'nueva' : ''}" href="#/md/${id}">${avatar(c)}<div class="cuerpo">
      <div class="cab"><span class="n">${esc(c.nombre)}</span>${verif(c)}<span class="u">@${esc(c.usuario)}</span><span class="t">· ${hace(v.ult.creado)}</span></div>
      <div class="ult">${v.ult.de === yo.id ? 'Tú: ' : ''}${esc(v.ult.texto)}</div></div>${v.nuevos ? '<span class="punto" style="position:static">' + v.nuevos + '</span>' : ''}</a>`;
  }).join('') || '<div class="vacio"><h2>Sin mensajes</h2>Entra en un perfil y dale al sobre para escribirle.</div>';
}

async function vistaChat(otroId) {
  const c = cuenta(otroId); const yo = S.yo.x;
  if (!c || !yo) return marco('Mensajes', '<div class="vacio">Conversación no encontrada.</div>', { atras: true });
  marco(esc(c.nombre), '<div class="cargando">Cargando…</div>', { atras: true, sub: '@' + esc(c.usuario) });
  const { data } = await sb.from('mensajes').select('*').eq('plataforma', 'x')
    .or(`and(de.eq.${yo.id},para.eq.${c.id}),and(de.eq.${c.id},para.eq.${yo.id})`).order('creado');
  const nuevos = (data || []).filter(m => m.para === yo.id && !m.leido).map(m => m.id);
  if (nuevos.length) { await sb.from('mensajes').update({ leido: true }).in('id', nuevos); S.noLeidos = Math.max(0, S.noLeidos - nuevos.length); }
  const main = document.getElementById('main');
  main.innerHTML = `<div class="burbujas">${(data || []).map(m => `<div class="bb ${m.de === yo.id ? 'yo' : 'el'}">${esc(m.texto)}${m.propina ? `<b> · propina ${m.propina} €</b>` : ''}<span class="hora">${hace(m.creado)}</span></div>`).join('') || `<div class="vacio">Escríbele a @${esc(c.usuario)}.</div>`}</div>
    <div class="escribir"><textarea id="mtx" rows="1" placeholder="Escribe un mensaje"></textarea><button class="btn azul" id="menv">Enviar</button></div>`;
  window.scrollTo(0, document.body.scrollHeight);
  document.getElementById('menv').onclick = async () => {
    const t = document.getElementById('mtx').value.trim(); if (!t) return;
    const { error } = await sb.from('mensajes').insert({ plataforma: 'x', de: yo.id, para: c.id, texto: t, origen: 'web' });
    if (error) return toast(error.message);
    vistaChat(otroId);
  };
}

/* ---------- consumo ---------- */
async function vistaConsumo() {
  marco('Consumo', '<div class="cargando">Cargando…</div>', { sub: 'Llamadas a modelos de la red' });
  const desde = new Date(Date.now() - 7 * 864e5).toISOString();
  const [ult, cfg, sem] = await Promise.all([
    sb.from('consumo').select('*').order('creado', { ascending: false }).limit(30),
    sb.from('config').select('valor').eq('clave', 'tanda').maybeSingle(),
    sb.from('consumo').select('*').gte('creado', desde),
  ]);
  const t = cfg.data?.valor || {};
  const hoyStr = new Date().toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid' });
  const filas = sem.data || [];
  const tot = r => (r.tokens_in || 0) + (r.tokens_out || 0);
  const hoy = filas.filter(r => new Date(r.creado).toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid' }) === hoyStr);
  const hoyT = hoy.reduce((a, r) => a + tot(r), 0), semT = filas.reduce((a, r) => a + tot(r), 0);
  const tandas = filas.filter(r => r.para === 'reacciones' && !r.saltada && !r.error);
  const media = tandas.length ? Math.round(tandas.reduce((a, r) => a + tot(r), 0) / tandas.length) : 0;
  const msMed = tandas.length ? Math.round(tandas.reduce((a, r) => a + (r.duracion_ms || 0), 0) / tandas.length / 1000) : 0;
  const salt = filas.filter(r => r.saltada).length, errs = filas.filter(r => r.error).length;
  const tope = t.tope_diario_tokens || 0, pct = tope ? Math.min(100, hoyT / tope * 100) : 0;
  const porQuien = {}; filas.forEach(r => { porQuien[r.quien] = (porQuien[r.quien] || 0) + tot(r); });
  document.getElementById('main').innerHTML = `
    <div class="tarjetas">
      <div class="tj" style="grid-column:1/-1"><div class="k">Hoy</div><div class="v">${num(hoyT)} tokens</div>
        <div class="barra"><i class="${pct > 80 ? 'alto' : ''}" style="width:${pct}%"></i></div>
        <div class="s">Tope diario: ${num(tope)} · ${Math.round(pct)} % · <a href="#" id="cambiaTope" style="color:var(--azul)">cambiar</a></div></div>
      <div class="tj"><div class="k">Últimos 7 días</div><div class="v">${num(semT)}</div><div class="s">${filas.length} llamadas</div></div>
      <div class="tj"><div class="k">Media por tanda</div><div class="v">${num(media)}</div><div class="s">${tandas.length} tandas · ${msMed} s de media</div></div>
      <div class="tj"><div class="k">Saltadas por tope</div><div class="v">${salt}</div><div class="s">7 días</div></div>
      <div class="tj"><div class="k">Con error</div><div class="v">${errs}</div><div class="s">7 días</div></div>
    </div>
    <div class="seccion">Por quién (7 días)</div>
    <div style="padding:0 16px"><table>${Object.entries(porQuien).sort((a, b) => b[1] - a[1]).map(([q, n]) => `<tr><td>${esc(q)}</td><td class="num">${num(n)}</td></tr>`).join('') || '<tr><td style="color:var(--tx2)">Nada todavía</td></tr>'}</table></div>
    <div class="seccion">Últimas llamadas</div>
    <div style="padding:0 16px 24px;overflow-x:auto"><table>
      <tr><th>Cuándo</th><th>Quién</th><th>Para</th><th class="num">Entrada</th><th class="num">Salida</th><th class="num">s</th></tr>
      ${(ult.data || []).map(r => `<tr title="${esc(r.error || r.nota || '')}"><td>${hace(r.creado)}</td><td>${esc(r.quien)}</td><td>${esc(r.para)}${r.saltada ? ' · saltada' : ''}${r.error ? ' · <span style="color:#f4212e">error</span>' : ''}</td><td class="num">${num(r.tokens_in)}</td><td class="num">${num(r.tokens_out)}</td><td class="num">${r.duracion_ms ? Math.round(r.duracion_ms / 1000) : ''}</td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--tx2)">Aún no hay llamadas registradas.</td></tr>'}
    </table>
    <p class="aviso">Modelo de las reacciones: ${esc(t.modelo || '?')} · tanda ${t.activa === false ? 'parada' : 'activa'} · máx. ${t.max_posts_por_tanda || '?'} posts por tanda.</p></div>`;
  document.getElementById('cambiaTope').onclick = async e => {
    e.preventDefault();
    const v = prompt('Tope diario de tokens para la red (entrada + salida):', tope);
    if (v === null) return; const n = parseInt(v.replace(/\D/g, ''));
    if (!n) return toast('Número no válido');
    const { error } = await sb.from('config').update({ valor: { ...t, tope_diario_tokens: n } }).eq('clave', 'tanda');
    if (error) return toast(error.message);
    vistaConsumo();
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') pantallaLogin(); });
arrancar().catch(e => { console.error(e); $app.innerHTML = `<div class="vacio">Error al arrancar: ${esc(e.message || e)}</div>`; });
</script>
